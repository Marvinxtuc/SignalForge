phases:
  # Canonical v2.1 phase marker set:
  # - phase_-1_governance_bootstrap
  # - phase_0_infrastructure
  # - phase_1_data_model
  # - phase_2_backend_api
  # - phase_3_connector_abstraction
  # - phase_4_p0_connectors
  # - phase_5_processing_pipeline
  # - phase_6_frontend_mvp
  # - phase_7_testing_acceptance_release_freeze
  phase_-1_governance_bootstrap:
    required_outputs:
      - git_repo
      - github_workflows
      - pr_template
      - codeowners
      - docs_structure
      - sop_yaml
      - validation_scripts
      - readme
      - env_example
      - gitignore
    gates:
      - docs_gate
      - no_secrets_gate
    notes:
      - Phase -1 does not implement business functionality.

  phase_0_infrastructure:
    required_outputs:
      - docker_compose
      - fastapi_health
      - nextjs_app
      - postgres_pgvector
      - redis
      - wait_for_ready
    gates:
      - docker_gate
      - code_gate
      - docs_gate
      - no_secrets_gate

  phase_1_data_model:
    required_outputs:
      - sqlalchemy_models
      - alembic_migrations
      - demo_seed
      - opportunities_model
    gates:
      - migration_gate
      - seed_gate
      - data_validation_gate

  phase_2_backend_api:
    required_outputs:
      - projects_api
      - keywords_api
      - collection_jobs_api
      - collection_logs_api
      - signals_api
      - clusters_api
      - opportunities_api
      - reports_api
      - settings_api
      - api_tests
      - backend_api_validation
    gates:
      - api_gate
      - code_gate
      - docs_gate
      - no_token_leak_gate
    notes:
      - Phase 2 implements Backend API only.
      - POST collect creates a pending job only and must not execute connectors.
      - Phase 3 owns connector abstraction.
      - Phase 4 owns P0 connectors.
      - Phase 5 owns processing pipeline.
      - Phase 6 owns frontend MVP.

  phase_3_connector_abstraction:
    required_outputs:
      - base_connector
      - normalized_raw_item
      - connector_result
      - rate_limit_state
      - collection_job_lifecycle
      - mock_connector
      - disabled_connector
      - connector_registry
      - connector_tests
      - connector_abstraction_validation
    gates:
      - connector_gate
      - logs_gate
      - code_gate
      - no_secrets_gate
    notes:
      - Phase 3 implements Connector Abstraction only.
      - Phase 3 does not implement Reddit or Product Hunt real connectors.
      - POST collect supports only mock, disabled_only, and safe_disabled.
      - Real platform connectors are unavailable until Phase 4.
      - Phase 5 owns processing pipeline.
      - Phase 6 owns frontend MVP.

  phase_4_p0_connectors:
    required_outputs:
      - reddit_connector
      - product_hunt_connector
      - env_only_credential_resolver
      - http_client_timeout_and_redaction
      - mocked_p0_connector_tests
      - p0_connector_validation
      - manual_smoke_scripts
      - collection_logs
      - raw_items_standardized_write
    gates:
      - connector_gate
      - mocked_ci_gate
      - no_token_leak_gate
      - no_real_token_ci_gate
    notes:
      - Phase 4 implements P0 Connectors only.
      - Reddit and Product Hunt are P0.
      - X and Discord remain unimplemented.
      - CI uses mocked responses only and must not require real tokens.
      - Manual smoke is local/manual only.
      - Manual smoke default does not write raw_items.
      - Product Hunt default API use is non-commercial unless Product Hunt grants permission.
      - Reddit deletion handling and rate limits are mandatory.
      - Phase 5 owns processing pipeline.
      - Phase 6 owns frontend MVP.
      - Phase 4 is not final MVP acceptance.

  phase_5_processing_pipeline:
    required_outputs:
      - cleaning
      - redaction
      - dedupe
      - duplicate_collapse
      - mock_llm_classification
      - fallback
      - mock_embeddings
      - clustering
      - signal_quality_gate
      - opportunity_generation
      - processing_api
      - processing_validation
    gates:
      - pipeline_gate
      - signal_quality_gate
      - mock_provider_gate
      - no_secrets_gate
    notes:
      - Phase 5 implements Processing Pipeline only.
      - CI uses mock LLM, mock embedding, and deterministic fallback only.
      - Real LLM and embedding smoke are optional local/manual checks.
      - Signal Inbox, Dashboard, and Opportunity Board remain unimplemented until Phase 6.
      - X and Discord remain unimplemented.
      - Phase 5 must not add database migrations or processing job/log tables.
      - Phase 5 is not final MVP acceptance.

  phase_6_frontend_mvp:
    required_outputs:
      - signal_inbox
      - dashboard
      - opportunity_board
      - logs
      - settings
      - reports
    gates:
      - frontend_gate
      - ui_acceptance_gate

  phase_7_testing_acceptance_release_freeze:
    required_outputs:
      - final_test_report
      - acceptance_report
      - release_notes
      - rollback_runbook
      - tag_or_tag_checklist
    gates:
      - acceptance_gate
      - release_gate
