name: Code Gate

on:
  pull_request:
  push:
    branches:
      - feature/mvp-p0

permissions:
  contents: read

jobs:
  phase-5-processing-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 5 file structure check
        run: |
          test -f README.md
          test -f .env.example
          test -f .gitignore
          test -f CODEOWNERS
          test -f .github/pull_request_template.md
          test -f apps/api/app/main.py
          test -f apps/api/Dockerfile
          test -f infra/docker-compose.yml
          test -f scripts/wait_for_services.py
          test -f scripts/validate_backend_api.py
          test -f scripts/validate_connector_abstraction.py
          test -f scripts/validate_p0_connectors.py
          test -f scripts/validate_processing_pipeline.py
          test -f apps/api/tests/test_connector_base.py
          test -f apps/api/tests/test_connector_registry.py
          test -f apps/api/tests/test_disabled_connector.py
          test -f apps/api/tests/test_mock_connector.py
          test -f apps/api/tests/test_reddit_connector.py
          test -f apps/api/tests/test_product_hunt_connector.py
          test -f apps/api/tests/test_p0_connector_degradation.py
          test -f apps/api/tests/test_p0_connector_rate_limits.py
          test -f apps/api/tests/test_p0_connector_no_token_leak.py
          test -f apps/api/tests/test_processing_cleaner.py
          test -f apps/api/tests/test_processing_redactor.py
          test -f apps/api/tests/test_processing_classifier.py
          test -f apps/api/tests/test_processing_fallback.py
          test -f apps/api/tests/test_processing_embedding.py
          test -f apps/api/tests/test_processing_clustering.py
          test -f apps/api/tests/test_signal_quality_gate.py
          test -f apps/api/tests/test_processing_pipeline.py
          echo "Phase 5 code gate validates Processing Pipeline with mock LLM, mock embedding, and fallback only. Real provider tokens, frontend acceptance, X, and Discord are not required."
      - name: Python syntax check
        run: |
          python3 -m compileall apps/api/app scripts
      - name: Governance validation
        run: |
          python3 scripts/validate_docs.py
          python3 scripts/validate_acceptance.py
      - name: No secrets validation
        run: |
          python3 scripts/validate_no_secrets.py
      - name: Build Docker images
        run: |
          docker compose -f infra/docker-compose.yml build
      - name: Start services
        run: |
          docker compose -f infra/docker-compose.yml up -d
      - name: Wait for services
        run: |
          python3 scripts/wait_for_services.py
      - name: Apply migrations
        run: |
          docker compose -f infra/docker-compose.yml run --rm api alembic upgrade head
      - name: Seed demo data
        run: |
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/seed_demo_data.py
      - name: Validate data model
        run: |
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/validate_data_model.py
      - name: Connector abstraction tests
        run: |
          docker compose -f infra/docker-compose.yml run --rm api pytest /app/tests/test_connector_base.py /app/tests/test_connector_registry.py /app/tests/test_disabled_connector.py /app/tests/test_mock_connector.py
      - name: Mocked P0 connector tests
        env:
          SIGNALFORGE_ALLOW_REAL_PLATFORM_SMOKE: "false"
        run: |
          docker compose -f infra/docker-compose.yml run --rm api pytest /app/tests/test_reddit_connector.py /app/tests/test_product_hunt_connector.py /app/tests/test_p0_connector_degradation.py /app/tests/test_p0_connector_rate_limits.py /app/tests/test_p0_connector_no_token_leak.py
      - name: Full pytest regression
        env:
          SIGNALFORGE_ALLOW_REAL_PLATFORM_SMOKE: "false"
        run: |
          docker compose -f infra/docker-compose.yml run --rm api pytest
      - name: Connector abstraction validation
        run: |
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/validate_connector_abstraction.py
      - name: Backend API validation
        run: |
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/validate_backend_api.py
      - name: P0 connector validation
        env:
          SIGNALFORGE_ALLOW_REAL_PLATFORM_SMOKE: "false"
        run: |
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/validate_p0_connectors.py
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/validate_p0_connectors.py --no-token-leak
      - name: Processing pipeline tests
        env:
          SIGNALFORGE_ALLOW_REAL_LLM_SMOKE: "false"
          SIGNALFORGE_ALLOW_REAL_EMBEDDING_SMOKE: "false"
        run: |
          docker compose -f infra/docker-compose.yml run --rm api pytest /app/tests/test_processing_cleaner.py /app/tests/test_processing_redactor.py /app/tests/test_processing_classifier.py /app/tests/test_processing_fallback.py /app/tests/test_processing_embedding.py /app/tests/test_processing_clustering.py /app/tests/test_signal_quality_gate.py /app/tests/test_processing_pipeline.py
      - name: Processing pipeline validation
        env:
          SIGNALFORGE_ALLOW_REAL_LLM_SMOKE: "false"
          SIGNALFORGE_ALLOW_REAL_EMBEDDING_SMOKE: "false"
        run: |
          docker compose -f infra/docker-compose.yml run --rm api python /app/scripts/validate_processing_pipeline.py
      - name: Docker Compose down
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml down
