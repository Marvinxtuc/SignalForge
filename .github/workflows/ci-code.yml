name: Code Gate

on:
  pull_request:
  push:
    branches:
      - feature/mvp-p0

permissions:
  contents: read

jobs:
  phase-0-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 file structure check
        run: |
          test -f README.md
          test -f .env.example
          test -f .gitignore
          test -f CODEOWNERS
          test -f .github/pull_request_template.md
          test -f apps/api/app/main.py
          test -f apps/api/Dockerfile
          test -f apps/web/package.json
          test -f apps/web/Dockerfile
          test -f infra/docker-compose.yml
          test -f scripts/wait_for_services.py
          echo "Phase 0 code gate checks infrastructure skeleton only. Business tests will be enabled in later phases."
      - name: Python syntax check
        run: |
          python3 -m py_compile apps/api/app/main.py apps/api/app/config.py scripts/wait_for_services.py
      - name: Web package manifest check
        run: |
          node -e "const pkg=require('./apps/web/package.json'); if (!pkg.scripts || !pkg.scripts.build) process.exit(1);"
